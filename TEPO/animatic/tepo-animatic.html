<title>TEPO El Pelón Loquillo — Animatic</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07090F;
  --accent:#C9A455;
  --accent-glow:rgba(201,164,85,0.18);
  --text:#EDE8DF;
  --muted:#4A5168;
  --border:rgba(201,164,85,0.14);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px;
  gap:10px;
  overflow:hidden;
}

.wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:860px;
  gap:8px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:0 2px;
}

.series-name{
  font-family:Impact,'Arial Narrow',sans-serif;
  font-size:clamp(13px,2.2vw,19px);
  letter-spacing:.2em;
  color:var(--accent);
  text-transform:uppercase;
}

.scene-id{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em;
  font-variant-numeric:tabular-nums;
}

.viewport{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border:1px solid var(--border);
  cursor:pointer;
}

canvas{width:100%;height:100%;display:block;}

/* Letterbox bars */
.bars::before,.bars::after{
  content:'';
  position:absolute;
  left:0;right:0;
  height:7.5%;
  background:#000;
  z-index:2;
  pointer-events:none;
}
.bars::before{top:0}
.bars::after{bottom:0}

.scene-info{
  position:absolute;
  bottom:7.5%;
  left:0;right:0;
  padding:8px 14px 6px;
  background:linear-gradient(transparent,rgba(0,0,0,0.72));
  z-index:3;
  pointer-events:none;
}

.scene-label{
  font-family:Impact,'Arial Narrow',sans-serif;
  font-size:clamp(10px,1.8vw,15px);
  letter-spacing:.22em;
  color:var(--accent);
}

.scene-desc{
  font-size:clamp(8px,1.1vw,11px);
  color:rgba(237,232,223,.72);
  margin-top:2px;
  line-height:1.4;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
}

.play-btn{
  width:30px;height:30px;
  border:1px solid var(--border);
  background:var(--accent-glow);
  color:var(--accent);
  border-radius:50%;
  cursor:pointer;
  font-size:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .15s;
}
.play-btn:hover{background:rgba(201,164,85,.3)}

.progress{
  flex:1;height:2px;
  background:rgba(255,255,255,.08);
  border-radius:1px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:1px;
  width:0%;
}

.audio-cue{
  font-size:9px;
  color:var(--muted);
  min-width:150px;
  text-align:right;
  flex-shrink:0;
  letter-spacing:.04em;
}

.dots{
  display:flex;gap:7px;
  justify-content:center;
  width:100%;
}
.dot{
  width:5px;height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  cursor:pointer;
  transition:all .2s;
  flex-shrink:0;
  border:none;
  padding:0;
}
.dot.on{background:var(--accent);transform:scale(1.5)}
.dot:hover{background:rgba(201,164,85,.45)}

@media(prefers-color-scheme:light){
  :root{--bg:#07090F;--text:#EDE8DF}
}
</style>

<div class="wrapper">
  <div class="header">
    <div class="series-name">TEPO El Pelón Loquillo</div>
    <div class="scene-id" id="scId">TOMA 1 / 8</div>
  </div>

  <div class="viewport" id="vp" onclick="togglePlay()">
    <canvas id="c"></canvas>
    <div class="bars"></div>
    <div class="scene-info">
      <div class="scene-label" id="scLabel">EL IRIS</div>
      <div class="scene-desc" id="scDesc">Oscuridad total. El ojo del pelón emerge lentamente desde el centro.</div>
    </div>
  </div>

  <div class="controls">
    <button class="play-btn" id="playBtn" onclick="event.stopPropagation();togglePlay()">▶</button>
    <div class="progress" id="prog" onclick="seek(event)">
      <div class="progress-fill" id="pf"></div>
    </div>
    <div class="audio-cue" id="aud">♪ Latido de corazón</div>
  </div>

  <div class="dots" id="dots"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─── SCENE DATA ───────────────────────────────────────────────────────────────
const SCENES = [
  { id:1, label:'EL IRIS',             desc:'Oscuridad total. El ojo del pelón emerge lentamente desde el centro.',                             audio:'🎵 Silencio absoluto → latido de corazón lento y profundo',                              dur:3800, draw:drawIris },
  { id:2, label:'LA FÁBRICA',          desc:'Fachada de planta industrial china. La cámara avanza hacia las letras rojas.',                     audio:'🎵 Sintetizador oscuro tipo CP2 + viento industrial lejano',                            dur:3200, draw:drawFactory },
  { id:3, label:'LA BOCA',             desc:'Desde el interior de la boca del pelón nuevo. Labios y mejillas rosadas se revelan.',              audio:'🎵 Suspenso en crescendo — cuerdas graves + eco de fábrica',                           dur:2800, draw:drawMouth },
  { id:4, label:'LÍNEAS DE PRODUCCIÓN',desc:'Vista aérea de la planta. Bandas de ensamble con partes de muñecos moviéndose.',                  audio:'🎵 Máquinas industriales reales: prensas, bandas, pistones + bajo oscuro',              dur:3200, draw:drawProduction },
  { id:5, label:'LAS MANITAS',         desc:'Entre los dedos regordetes del pelón. La cámara retrocede revelando la mano completa.',            audio:'🎵 Música se detiene — silencio total con respiración leve',                           dur:2800, draw:drawHands },
  { id:6, label:'LA BODEGA',           desc:'Vista aérea descendente. Cientos de cajas con muñecos apiladas hasta el techo.',                   audio:'🎵 Reverb profundo + nota de cello sostenida — tensión máxima',                        dur:3000, draw:drawWarehouse },
  { id:7, label:'EL CIERRE',           desc:'Trabajador sella la caja. Silencio. La cabeza del pelón se mueve... ¡y se escucha un BONK!',       audio:'🎵 Silencio → crujido → BONK cómico: quiebre del suspenso con humor',                  dur:4500, draw:drawSealing },
  { id:8, label:'TÍTULO',              desc:'"TEPO El Pelón Loquillo" aparece letra por letra. El tono cambia a comedia.',                       audio:'🎵 Stinger orquestal + trompeta cómica — firma musical del personaje',                  dur:3500, draw:drawTitle },
];

const TOTAL = SCENES.reduce((s,sc)=>s+sc.dur,0);

// Factory windows (deterministic)
const FW = Array.from({length:28},(_,i)=> (i*3+7)%4!==0);
// Warehouse boxes
const WB = Array.from({length:60},(_,i)=>({shade:((i*7+13)%10)/10, color:['#6B1A1A','#1A3A7A','#1A5A2A','#6B5A1A'][i%4]}));

// ─── STATE ────────────────────────────────────────────────────────────────────
let scene=0, tStart=null, playing=false, raf=null;

function W(){return canvas.width}
function H(){return canvas.height}

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  if(canvas.width!==Math.round(r.width)||canvas.height!==Math.round(r.height)){
    canvas.width=Math.round(r.width);
    canvas.height=Math.round(r.height);
  }
}

function progress(){
  if(!tStart) return 0;
  return Math.min(1,(Date.now()-tStart)/SCENES[scene].dur);
}

function totalProgress(){
  let e=SCENES.slice(0,scene).reduce((s,sc)=>s+sc.dur,0);
  if(tStart) e+=Date.now()-tStart;
  return Math.min(1,e/TOTAL);
}

// ─── DRAW HELPERS ─────────────────────────────────────────────────────────────
function fade(alpha){
  ctx.fillStyle=`rgba(0,0,0,${alpha})`;
  ctx.fillRect(0,0,W(),H());
}

function fadeIn(p,d=0.1){ if(p<d) fade(1-p/d); }
function fadeOut(p,s=0.88,d=0.12){ if(p>s) fade((p-s)/d); }

function vignette(strength=0.6){
  const g=ctx.createRadialGradient(W()/2,H()/2,H()*0.1,W()/2,H()/2,H()*0.72);
  g.addColorStop(0,'transparent');
  g.addColorStop(1,`rgba(0,0,0,${strength})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W(),H());
}

// ─── SCENE 1: IRIS ────────────────────────────────────────────────────────────
function drawIris(p){
  const w=W(),h=H(),cx=w/2,cy=h/2;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);

  const r=Math.min(w,h)*(0.04+p*0.5);

  // Iris
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  ig.addColorStop(0,'#000');
  ig.addColorStop(0.22,'#0A1830');
  ig.addColorStop(0.5,'#18508A');
  ig.addColorStop(0.72,'#6EB8DA');
  ig.addColorStop(0.88,'#4A8FAA');
  ig.addColorStop(0.96,'#2060A0');
  ig.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=ig; ctx.fill();

  // Iris fiber lines
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  ctx.globalAlpha=0.22;
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r*0.28,cy+Math.sin(a)*r*0.28);
    ctx.lineTo(cx+Math.cos(a)*r*0.97,cy+Math.sin(a)*r*0.97);
    ctx.strokeStyle='#90D0E8'; ctx.lineWidth=0.6; ctx.stroke();
  }
  ctx.restore();

  // Pupil
  const pr=r*0.3;
  const pg=ctx.createRadialGradient(cx-pr*.2,cy-pr*.2,0,cx,cy,pr);
  pg.addColorStop(0,'#1A1A1A'); pg.addColorStop(1,'#000');
  ctx.beginPath(); ctx.arc(cx,cy,pr,0,Math.PI*2);
  ctx.fillStyle=pg; ctx.fill();

  // Highlight
  ctx.beginPath(); ctx.arc(cx-pr*.32,cy-pr*.32,pr*.17,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.65)'; ctx.fill();

  // Flash
  if(p>0.82) fade(Math.min(1,(p-0.82)/.16));
  fadeIn(p,.08);
}

// ─── SCENE 2: FACTORY ────────────────────────────────────────────────────────
function drawFactory(p){
  const w=W(),h=H(),cx=w/2;

  // Sky
  const sk=ctx.createLinearGradient(0,0,0,h*.6);
  sk.addColorStop(0,'#0C0D12'); sk.addColorStop(1,'#181B22');
  ctx.fillStyle=sk; ctx.fillRect(0,0,w,h);

  // Ground
  ctx.fillStyle='#090A0D'; ctx.fillRect(0,h*.78,w,h*.22);
  ctx.fillStyle='#131520'; ctx.fillRect(0,h*.78,w,h*.01);

  // Zoom
  const z=1+p*1.1;
  ctx.save();
  ctx.translate(cx,h*.5); ctx.scale(z,z); ctx.translate(-cx,-h*.5);

  // Building
  const bx=w*.07,bw=w*.86,bt=h*.16,bh=h*.63;
  ctx.fillStyle='#14171E'; ctx.fillRect(bx,bt,bw,bh);
  ctx.strokeStyle='#22262F'; ctx.lineWidth=1; ctx.strokeRect(bx,bt,bw,bh);

  // Structure lines
  ctx.strokeStyle='#1A1D26'; ctx.lineWidth=.5;
  for(let i=1;i<5;i++){
    const y=bt+(bh/5)*i;
    ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx+bw,y); ctx.stroke();
  }

  // Windows
  const wC=7,wR=4,wPx=bw/(wC+1),wPy=bh/(wR+1.5);
  const wwW=wPx*.48,wwH=wPy*.5;
  FW.forEach((lit,i)=>{
    const col=i%wC,row=Math.floor(i/wC);
    if(row>=wR) return;
    const wx=bx+wPx*(col+.75)-wwW/2;
    const wy=bt+wPy*(row+.55)-wwH/2;
    ctx.fillStyle=lit?'#C9A020':'#0C0E12'; ctx.fillRect(wx,wy,wwW,wwH);
    if(lit){ctx.fillStyle='rgba(201,160,32,.12)'; ctx.fillRect(wx-3,wy-3,wwW+6,wwH+6);}
  });

  // Chimney
  ctx.fillStyle='#0F1218'; ctx.fillRect(bx+bw*.72,bt-h*.17,bw*.055,h*.19);
  // Smoke
  ctx.save(); ctx.globalAlpha=.15;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.arc(bx+bw*.747,bt-h*.2-i*h*.07,h*.025+i*h*.014,0,Math.PI*2);
    ctx.fillStyle='#506070'; ctx.fill();
  }
  ctx.restore();

  // Red sign with Chinese characters
  const sy=bt+bh*.5;
  ctx.fillStyle='#991A1A'; ctx.fillRect(bx+bw*.2,sy-h*.075,bw*.6,h*.13);
  ctx.fillStyle='#FFD700';
  ctx.font=`bold ${h*.09}px serif`;
  ctx.textAlign='center';
  ctx.fillText('玩具工厂',cx,sy+h*.04);
  ctx.font=`${h*.022}px serif`;
  ctx.fillStyle='#CC9900';
  ctx.fillText('成立于 1998',cx,sy+h*.09);

  ctx.restore();

  fadeIn(p,.1); fadeOut(p,.85,.13);
}

// ─── SCENE 3: MOUTH ──────────────────────────────────────────────────────────
function drawMouth(p){
  const w=W(),h=H(),cx=w/2,cy=h/2;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);

  const z=2.8-p*2.0;
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(z,z); ctx.translate(-cx,-cy);

  // Inner mouth bg
  const mg=ctx.createRadialGradient(cx,cy+h*.08,0,cx,cy,h*.45);
  mg.addColorStop(0,'#B86060'); mg.addColorStop(.45,'#9A4848');
  mg.addColorStop(.75,'#7A2828'); mg.addColorStop(1,'#000');
  ctx.fillStyle=mg; ctx.fillRect(0,0,w,h);

  // Upper lip
  ctx.save(); ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(0,h*.37);
  ctx.quadraticCurveTo(cx*.6,h*.3,cx,h*.33);
  ctx.quadraticCurveTo(cx*1.4,h*.3,w,h*.37);
  ctx.lineTo(w,0); ctx.closePath();
  const ulg=ctx.createLinearGradient(0,0,0,h*.37);
  ulg.addColorStop(0,'#F5C0B8'); ulg.addColorStop(.7,'#EAA8A0'); ulg.addColorStop(1,'#D08080');
  ctx.fillStyle=ulg; ctx.fill(); ctx.restore();

  // Lower lip
  ctx.save(); ctx.beginPath();
  ctx.moveTo(0,h); ctx.lineTo(0,h*.64);
  ctx.quadraticCurveTo(cx*.55,h*.69,cx,h*.66);
  ctx.quadraticCurveTo(cx*1.45,h*.69,w,h*.64);
  ctx.lineTo(w,h); ctx.closePath();
  const llg=ctx.createLinearGradient(0,h*.64,0,h);
  llg.addColorStop(0,'#D08080'); llg.addColorStop(.35,'#EAA8A0'); llg.addColorStop(1,'#F5C0B8');
  ctx.fillStyle=llg; ctx.fill();
  // Lower highlight
  ctx.beginPath(); ctx.ellipse(cx,h*.76,w*.18,h*.022,0,0,Math.PI*2);
  ctx.fillStyle='rgba(255,225,220,.28)'; ctx.fill();
  ctx.restore();

  // Darkness vignette
  const dg=ctx.createRadialGradient(cx,cy,h*.05,cx,cy,h*.55);
  dg.addColorStop(0,'transparent'); dg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=dg; ctx.fillRect(0,0,w,h);

  ctx.restore();

  // Cheeks reveal
  if(p>.48){
    const ca=Math.min(1,(p-.48)/.42)*.55;
    ctx.save(); ctx.globalAlpha=ca;
    const lc=ctx.createRadialGradient(w*.16,h*.5,0,w*.16,h*.5,w*.13);
    lc.addColorStop(0,'#F4A4A0'); lc.addColorStop(1,'transparent');
    ctx.fillStyle=lc; ctx.fillRect(0,0,w,h);
    const rc=ctx.createRadialGradient(w*.84,h*.5,0,w*.84,h*.5,w*.13);
    rc.addColorStop(0,'#F4A4A0'); rc.addColorStop(1,'transparent');
    ctx.fillStyle=rc; ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  if(p<.07) fade(1-p/.07);
  if(p>.86) fade((p-.86)/.12);
}

// ─── SCENE 4: PRODUCTION ─────────────────────────────────────────────────────
function drawProduction(p){
  const w=W(),h=H();
  const pan=-h*.28*(1-p);
  ctx.save(); ctx.translate(0,pan);

  // Floor
  const fg=ctx.createLinearGradient(0,0,0,h*1.3);
  fg.addColorStop(0,'#131720'); fg.addColorStop(1,'#0D1015');
  ctx.fillStyle=fg; ctx.fillRect(0,0,w,h*1.3);

  // Ceiling
  ctx.fillStyle='#090B0F'; ctx.fillRect(0,0,w,h*.14);

  // Fluorescent lights
  for(let i=0;i<5;i++){
    const lx=w*(.1+i*.2);
    const lg=ctx.createRadialGradient(lx,h*.12,0,lx,h*.12,h*.28);
    lg.addColorStop(0,'rgba(210,240,255,.14)'); lg.addColorStop(1,'transparent');
    ctx.fillStyle=lg; ctx.fillRect(0,0,w,h*.4);
    ctx.fillStyle='#C8E8FF'; ctx.fillRect(lx-w*.055,h*.1,w*.11,h*.018);
  }

  function belt(y,dir){
    ctx.fillStyle='#181C26'; ctx.fillRect(0,y,w,h*.095);
    ctx.strokeStyle='#232840'; ctx.lineWidth=.8;
    for(let i=0;i<22;i++){
      const bx=((i/22+dir*p*.4)%1)*w;
      ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx,y+h*.095); ctx.stroke();
    }
    ctx.fillStyle='#2A3042'; ctx.fillRect(0,y-2,w,3);
    ctx.fillRect(0,y+h*.095,w,3);
  }

  const b1y=h*.36, b2y=h*.61;
  belt(b1y,1); belt(b2y,-1);

  // Heads on belt 1
  for(let i=0;i<6;i++){
    const dx=((i/6+p*.55)%1)*w;
    const dy=b1y+h*.047;
    ctx.fillStyle='#E8C4A2';
    ctx.beginPath(); ctx.ellipse(dx,dy,h*.028,h*.033,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#4A90B8';
    ctx.beginPath(); ctx.arc(dx-h*.01,dy-h*.006,h*.007,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(dx+h*.01,dy-h*.006,h*.007,0,Math.PI*2); ctx.fill();
  }

  // Arms on belt 2
  for(let i=0;i<7;i++){
    const dx=w-((i/7+p*.4)%1)*w;
    const dy=b2y+h*.047;
    ctx.fillStyle='#DEBBA0';
    ctx.save(); ctx.translate(dx,dy);
    ctx.beginPath(); ctx.ellipse(0,0,h*.012,h*.036,Math.PI*.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(h*.013,h*.034,h*.016,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Worker silhouettes
  for(let i=0;i<4;i++){
    const wx=w*(.14+i*.25);
    const wy=b1y-h*.16;
    ctx.fillStyle='#0C0F16';
    ctx.fillRect(wx-h*.024,wy,h*.048,h*.115);
    ctx.beginPath(); ctx.arc(wx,wy-h*.024,h*.024,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#18386A';
    ctx.beginPath(); ctx.ellipse(wx,wy-h*.04,h*.03,h*.014,0,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
  vignette(.48);
  fadeIn(p,.1); fadeOut(p,.87,.11);
}

// ─── SCENE 5: HANDS ──────────────────────────────────────────────────────────
function drawHands(p){
  const w=W(),h=H(),cx=w/2,cy=h/2;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);

  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,h*.65);
  bg.addColorStop(0,'#181008'); bg.addColorStop(1,'#000');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);

  const z=2.6-p*1.75;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(z,z); ctx.translate(-cx,-cy);

  // Palm
  const pg=ctx.createRadialGradient(cx,cy+h*.06,0,cx,cy,h*.32);
  pg.addColorStop(0,'#ECC8A0'); pg.addColorStop(.55,'#D4A870'); pg.addColorStop(1,'#A87840');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.ellipse(cx,cy+h*.08,w*.21,h*.27,0,0,Math.PI*2); ctx.fill();

  // Fingers
  const F=[
    {a:-.52,l:.21,t:.052},{a:-.18,l:.25,t:.057},
    {a:.06,l:.26,t:.057},{a:.28,l:.24,t:.054},
    {a:.58,l:.17,t:.047}
  ];
  F.forEach(f=>{
    const fx=cx+Math.sin(f.a)*w*.15, fy=cy-h*.09;
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(f.a*.28);
    const fg=ctx.createLinearGradient(-w*f.t,0,w*f.t,0);
    fg.addColorStop(0,'#C89860'); fg.addColorStop(.5,'#ECC8A0'); fg.addColorStop(1,'#B88040');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.ellipse(0,-h*f.l/2,w*f.t,h*f.l/2,0,0,Math.PI*2); ctx.fill();
    // Knuckle
    ctx.beginPath(); ctx.arc(0,0,w*f.t*.28,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.14)'; ctx.fill();
    // Tip
    ctx.beginPath(); ctx.arc(0,-h*f.l+h*f.t*.5,w*f.t*.85,0,Math.PI*2);
    ctx.fillStyle='#ECC8A0'; ctx.fill();
    ctx.restore();
  });

  // Wrist creases
  ctx.save(); ctx.globalAlpha=.16;
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.ellipse(cx,cy+h*.22+i*h*.028,w*.17-i*w*.02,h*.009,0,0,Math.PI*2);
    ctx.strokeStyle='#7A4020'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
  vignette(.78);
  fadeIn(p,.1); fadeOut(p,.86,.12);
}

// ─── SCENE 6: WAREHOUSE ──────────────────────────────────────────────────────
function drawWarehouse(p){
  const w=W(),h=H(),cx=w/2;
  ctx.fillStyle='#070810'; ctx.fillRect(0,0,w,h);

  // Perspective lines
  const vp={x:cx,y:h*.3};
  ctx.strokeStyle='#15182A'; ctx.lineWidth=.5;
  for(let i=0;i<=10;i++){
    const fx=(i/10)*w;
    ctx.beginPath(); ctx.moveTo(fx,h); ctx.lineTo(vp.x,vp.y); ctx.stroke();
  }
  for(let i=0;i<=6;i++){
    const fy=vp.y+(i/6)*(h-vp.y);
    ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(w,fy); ctx.stroke();
  }

  // Shelf rows
  const rows=5;
  for(let row=0;row<rows;row++){
    const rY=h*(.83-row*.13);
    const rH=h*.09*(1-row*.1);
    const cols=10;
    for(let col=0;col<cols;col++){
      const bw=(w*.9)/cols;
      const bx=w*.05+col*bw;
      const wb=WB[(row*cols+col)%WB.length];
      const b=Math.floor(22+wb.shade*20);
      ctx.fillStyle=`rgb(${b+8},${b},${b+4})`;
      ctx.fillRect(bx+1,rY-rH,bw-2,rH);
      // top
      ctx.fillStyle=`rgb(${b+18},${b+12},${b+15})`;
      ctx.fillRect(bx+1,rY-rH,bw-2,rH*.11);
      // color stripe
      ctx.fillStyle=wb.color; ctx.globalAlpha=.38;
      ctx.fillRect(bx+bw*.1,rY-rH*.82,bw*.8,rH*.11);
      ctx.globalAlpha=1;
      // doll silhouette
      ctx.fillStyle='rgba(255,255,255,.07)';
      ctx.fillRect(bx+bw*.25,rY-rH*.65,bw*.5,rH*.44);
    }
    // Shelf plank
    ctx.fillStyle='#1C2030'; ctx.fillRect(w*.03,rY,w*.94,h*.013);
  }

  // Spotlights
  for(let i=0;i<4;i++){
    const lx=w*(.13+i*.25);
    const sg=ctx.createRadialGradient(lx,0,0,lx,h*.7,h*.65);
    sg.addColorStop(0,'rgba(240,230,180,.07)'); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.fillRect(0,0,w,h);
  }

  vignette(.65);
  fadeIn(p,.1); fadeOut(p,.87,.11);
}

// ─── SCENE 7: SEALING ────────────────────────────────────────────────────────
function drawSealing(p){
  const w=W(),h=H(),cx=w/2,cy=h/2;
  ctx.fillStyle='#090909'; ctx.fillRect(0,0,w,h);

  // Dim work light
  const wl=ctx.createRadialGradient(cx,cy-h*.18,0,cx,cy-h*.18,h*.55);
  wl.addColorStop(0,'rgba(48,38,18,.45)'); wl.addColorStop(1,'transparent');
  ctx.fillStyle=wl; ctx.fillRect(0,0,w,h);

  // Table
  ctx.fillStyle='#121008'; ctx.fillRect(0,h*.72,w,h*.28);
  ctx.fillStyle='#1C1A12'; ctx.fillRect(0,h*.72,w,h*.01);

  // Box
  const bw=w*.38,bh=h*.44;
  const bx=cx-bw/2,by=cy-bh*.62;

  ctx.fillStyle='#26221C'; ctx.fillRect(bx,by,bw,bh);
  // Side shadow
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(bx+bw,by+h*.01,h*.015,bh);
  // Print area
  ctx.fillStyle='#332E28'; ctx.fillRect(bx+bw*.1,by+bh*.1,bw*.8,bh*.35);

  // Doll face on box
  ctx.fillStyle='#E8C4A2';
  ctx.beginPath(); ctx.ellipse(cx,by+bh*.24,bw*.14,bw*.16,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4A90B8';
  ctx.beginPath(); ctx.arc(cx-bw*.05,by+bh*.22,bw*.025,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+bw*.05,by+bh*.22,bw*.025,0,Math.PI*2); ctx.fill();
  // Smile
  ctx.beginPath();
  ctx.arc(cx,by+bh*.27,bw*.055,0,Math.PI);
  ctx.strokeStyle='#C08870'; ctx.lineWidth=1.5; ctx.stroke();

  // Flaps closing
  const flapA = p<.35 ? (Math.PI*.48)*(1-p/.35) : 0;
  ctx.fillStyle='#1E1C16';
  // Left flap
  ctx.save(); ctx.translate(bx,by); ctx.rotate(-flapA);
  ctx.fillRect(0,0,bw*.5,bh*.055); ctx.restore();
  // Right flap
  ctx.save(); ctx.translate(bx+bw,by); ctx.rotate(flapA);
  ctx.fillRect(-bw*.5,0,bw*.5,bh*.055); ctx.restore();

  // Tape strip
  if(p>.42){
    const tp=Math.min(1,(p-.42)/.28);
    ctx.fillStyle='rgba(195,220,245,.5)';
    ctx.fillRect(cx-bw*tp*.5,by,bw*tp,bh*.028);
  }

  // Worker glove hands
  if(p<.72){
    const ha=p<.62?1:(1-(p-.62)/.1);
    ctx.save(); ctx.globalAlpha=ha;
    ctx.fillStyle='#182432';
    ctx.beginPath(); ctx.ellipse(bx-bw*.06,by+bh*.04,bw*.11,bh*.056,-0.28,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+bw+bw*.06,by+bh*.04,bw*.11,bh*.056,0.28,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // THE MOMENT — head moves p > 0.8
  if(p>.8){
    const mp=(p-.8)/.2;
    const shift=Math.sin(mp*Math.PI)*bw*.035;
    const rot=Math.sin(mp*Math.PI)*.06;

    ctx.save(); ctx.translate(shift*.4,0); ctx.rotate(rot*.5);
    ctx.fillStyle='#26221C';
    ctx.fillRect(bx-shift*.4,by-1,bw,bh*.06+2);
    ctx.restore();

    // Light crack
    if(mp>.28){
      const la=(mp-.28)*.6;
      ctx.fillStyle=`rgba(201,164,85,${la*.5})`;
      ctx.fillRect(bx+bw*.3+shift,by+bh*.025,bw*.4,bh*.004);
    }
  }

  vignette(.72);
  fadeIn(p,.07);
  // Stay dark at end intentionally — final scene cuts to black
  if(p>.9) fade((p-.9)/.09);
}

// ─── SCENE 8: TITLE ──────────────────────────────────────────────────────────
function drawTitle(p){
  const w=W(),h=H(),cx=w/2,cy=h/2;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);

  // Subtle radial bg
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,h*.65);
  bg.addColorStop(0,'#110F08'); bg.addColorStop(1,'#000');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);

  const fs=Math.min(w/8.5,h/4.8);
  const tepoReveal=Math.min(1,p*2.2);
  const sub1Reveal=Math.min(1,Math.max(0,(p-.3)*2.5));
  const sub2Reveal=Math.min(1,Math.max(0,(p-.5)*2.5));
  const lineReveal=Math.min(1,Math.max(0,(p-.52)*3.5));
  const tagReveal=Math.min(1,Math.max(0,(p-.72)*5));

  // "TEPO" — big main title
  ctx.save();
  const mw=w*.7;
  ctx.beginPath(); ctx.rect(cx-mw/2,0,mw*tepoReveal,h); ctx.clip();
  ctx.shadowColor='#C9A455'; ctx.shadowBlur=35;
  ctx.fillStyle='#EDE8DF';
  ctx.font=`900 ${fs*1.35}px Impact,'Arial Narrow',sans-serif`;
  ctx.textAlign='center';
  ctx.fillText('TEPO',cx,cy-fs*.28);
  ctx.restore();

  // "El Pelón" — first subtitle line
  ctx.save();
  const sw1=w*.6;
  ctx.beginPath(); ctx.rect(cx-sw1/2,0,sw1*sub1Reveal,h); ctx.clip();
  ctx.shadowColor='#C9A455'; ctx.shadowBlur=16;
  ctx.fillStyle='#C9A455';
  ctx.font=`900 ${fs*.58}px Impact,'Arial Narrow',sans-serif`;
  ctx.textAlign='center';
  ctx.fillText('El Pelón',cx,cy+fs*.38);
  ctx.restore();

  // "Loquillo" — second subtitle line
  ctx.save();
  const sw2=w*.55;
  ctx.beginPath(); ctx.rect(cx-sw2/2,0,sw2*sub2Reveal,h); ctx.clip();
  ctx.shadowColor='rgba(201,164,85,.4)'; ctx.shadowBlur=12;
  ctx.fillStyle='#C9A455';
  ctx.font=`900 ${fs*.58}px Impact,'Arial Narrow',sans-serif`;
  ctx.textAlign='center';
  ctx.fillText('Loquillo',cx,cy+fs*.88);
  ctx.restore();

  // Divider line under TEPO
  if(lineReveal>0){
    const lw=w*.42*lineReveal;
    ctx.strokeStyle=`rgba(201,164,85,${lineReveal*.5})`;
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-lw/2,cy+fs*.06); ctx.lineTo(cx+lw/2,cy+fs*.06); ctx.stroke();
  }

  // Tagline
  if(tagReveal>0){
    ctx.fillStyle=`rgba(74,81,104,${tagReveal})`;
    ctx.font=`${fs*.16}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('UNA SERIE ANIMADA',cx,cy+fs*1.22);
  }

  fadeIn(p,.08);
}

// ─── ENGINE ───────────────────────────────────────────────────────────────────
function updateUI(){
  const sc=SCENES[scene];
  document.getElementById('scId').textContent=`TOMA ${sc.id} / ${SCENES.length}`;
  document.getElementById('scLabel').textContent=sc.label;
  document.getElementById('scDesc').textContent=sc.desc;
  document.getElementById('aud').textContent=sc.audio;
  document.getElementById('pf').style.width=(totalProgress()*100)+'%';
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===scene));
}

function frame(){
  if(!playing) return;
  resize();
  const p=progress();
  SCENES[scene].draw(p);
  updateUI();
  if(p>=1){
    scene=(scene+1)%SCENES.length;
    tStart=Date.now();
  }
  raf=requestAnimationFrame(frame);
}

function togglePlay(){
  if(playing){playing=false;cancelAnimationFrame(raf);}
  else{playing=true;if(!tStart)tStart=Date.now();raf=requestAnimationFrame(frame);}
  updateUI();
}

function goTo(i){
  scene=i; tStart=Date.now();
  if(!playing){resize();SCENES[i].draw(0);updateUI();}
}

function seek(e){
  e.stopPropagation();
  const bar=document.getElementById('prog');
  const r=bar.getBoundingClientRect();
  let ratio=(e.clientX-r.left)/r.width;
  let elapsed=ratio*TOTAL, sc=0;
  while(sc<SCENES.length-1&&elapsed>SCENES[sc].dur){elapsed-=SCENES[sc].dur;sc++;}
  scene=sc; tStart=Date.now()-elapsed;
  if(!playing){resize();SCENES[sc].draw(elapsed/SCENES[sc].dur);updateUI();}
}

// Init
resize();
window.addEventListener('resize',()=>{resize();if(!playing){SCENES[scene].draw(progress());updateUI();}});
const dotsEl=document.getElementById('dots');
SCENES.forEach((sc,i)=>{
  const d=document.createElement('button');
  d.className='dot'+(i===0?' on':'');
  d.title=sc.label;
  d.onclick=(e)=>{e.stopPropagation();goTo(i);};
  dotsEl.appendChild(d);
});
SCENES[0].draw(0); updateUI();
togglePlay();
</script>
